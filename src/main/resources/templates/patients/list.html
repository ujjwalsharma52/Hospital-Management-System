<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{layout :: layout(~{::content})}">
    <div th:fragment="content">
        <div class="page-header">
            <h1><i class='bx bxs-user-plus mr-1'></i> Patients</h1>
            <div class="page-actions">
                <a th:href="@{/patients/add}" class="btn btn-primary">
                    <i class='bx bx-plus'></i> Add Patient
                </a>
            </div>
        </div>

        <div class="search-bar">
            <form th:action="@{/patients}" method="get" class="search-input-wrapper">
                <span class="search-icon"><i class='bx bx-search'></i></span>
                <input type="text" name="search" th:value="${search}" placeholder="Search patients by name..." class="form-control" style="padding-left:42px;">
            </form>
        </div>

        <div class="card">
            <div class="card-body" style="padding:0;">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Full Name</th>
                                <th>Gender</th>
                                <th>Date of Birth</th>
                                <th>Phone</th>
                                <th>Blood Group</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="patient, stat : ${patients}">
                                <td th:text="${stat.index + 1}">1</td>
                                <td>
                                    <a th:href="@{/patients/view/{id}(id=${patient.id})}" th:text="${patient.fullName}">Name</a>
                                </td>
                                <td th:text="${patient.gender}">M</td>
                                <td th:text="${patient.dateOfBirth}">1990-01-01</td>
                                <td th:text="${patient.phone}">9876543210</td>
                                <td><span class="badge badge-occupied" th:text="${patient.bloodGroup}">O+</span></td>
                                <td>
                                    <span class="badge" th:classappend="${patient.status == 'Active'} ? 'badge-active' : 'badge-inactive'" th:text="${patient.status}">Active</span>
                                </td>
                                <td>
                                    <div class="btn-group">
                                        <a th:href="@{/patients/view/{id}(id=${patient.id})}" class="btn btn-sm btn-outline" title="View"><i class='bx bx-show'></i></a>
                                        <a th:href="@{/patients/edit/{id}(id=${patient.id})}" class="btn btn-sm btn-primary" title="Edit"><i class='bx bx-edit'></i></a>
                                        <a th:href="@{/patients/delete/{id}(id=${patient.id})}" class="btn btn-sm btn-danger" title="Delete" onclick="return confirm('Are you sure you want to delete this patient?')"><i class='bx bx-trash'></i></a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(patients)}">
                                <td colspan="8">
                                    <div class="empty-state">
                                        <div class="empty-icon">👤</div>
                                        <h3>No patients found</h3>
                                        <p>Start by registering a new patient</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
