<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{layout :: layout(~{::content})}">
    <div th:fragment="content">
        <div class="page-header">
            <h1><i class='bx bxs-user-plus mr-1'></i>
                <span th:text="${patient.id != null} ? 'Edit Patient' : 'Register New Patient'">New Patient</span>
            </h1>
            <div class="page-actions">
                <a th:href="@{/patients}" class="btn btn-outline"><i class='bx bx-arrow-back'></i> Back to List</a>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/patients/save}" th:object="${patient}" method="post">
                    <input type="hidden" th:field="*{id}">

                    <div class="form-row">
                        <div class="form-group">
                            <label>Full Name *</label>
                            <input type="text" th:field="*{fullName}" class="form-control" placeholder="Enter full name" required>
                        </div>
                        <div class="form-group">
                            <label>Date of Birth *</label>
                            <input type="date" th:field="*{dateOfBirth}" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Gender *</label>
                            <select th:field="*{gender}" class="form-control" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" th:field="*{phone}" class="form-control" placeholder="Phone number">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="Email address">
                        </div>
                        <div class="form-group">
                            <label>Blood Group</label>
                            <select th:field="*{bloodGroup}" class="form-control">
                                <option value="">Select Blood Group</option>
                                <option value="A+">A+</option><option value="A-">A-</option>
                                <option value="B+">B+</option><option value="B-">B-</option>
                                <option value="AB+">AB+</option><option value="AB-">AB-</option>
                                <option value="O+">O+</option><option value="O-">O-</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Address</label>
                        <textarea th:field="*{address}" class="form-control" placeholder="Full address" rows="2"></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Allergies</label>
                            <input type="text" th:field="*{allergies}" class="form-control" placeholder="Known allergies">
                        </div>
                        <div class="form-group">
                            <label>Medical History</label>
                            <input type="text" th:field="*{medicalHistory}" class="form-control" placeholder="Previous conditions">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Emergency Contact Name</label>
                            <input type="text" th:field="*{emergencyContactName}" class="form-control" placeholder="Emergency contact">
                        </div>
                        <div class="form-group">
                            <label>Emergency Contact Phone</label>
                            <input type="tel" th:field="*{emergencyContactPhone}" class="form-control" placeholder="Emergency phone">
                        </div>
                        <div class="form-group">
                            <label>Status</label>
                            <select th:field="*{status}" class="form-control">
                                <option value="Active">Active</option>
                                <option value="Discharged">Discharged</option>
                            </select>
                        </div>
                    </div>

                    <div style="display:flex; gap:12px; margin-top:10px;">
                        <button type="submit" class="btn btn-primary">
                            <i class='bx bx-save'></i>
                            <span th:text="${patient.id != null} ? 'Update Patient' : 'Register Patient'">Save</span>
                        </button>
                        <a th:href="@{/patients}" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
