<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{layout :: layout(~{::content})}">
    <div th:fragment="content">
        <div class="page-header">
            <h1><i class='bx bxs-receipt mr-1'></i> Billing</h1>
            <div class="page-actions"><a th:href="@{/billing/add}" class="btn btn-primary"><i class='bx bx-plus'></i> Create Bill</a></div>
        </div>

        <!-- Revenue Summary -->
        <div class="stats-grid" style="grid-template-columns:repeat(3,1fr);">
            <div class="stat-card green">
                <div class="stat-icon"><i class='bx bxs-wallet'></i></div>
                <div class="stat-value">₹<span th:text="${#numbers.formatDecimal(totalRevenue, 0, 0)}">0</span></div>
                <div class="stat-label">Total Revenue</div>
            </div>
            <div class="stat-card blue">
                <div class="stat-icon"><i class='bx bxs-check-circle'></i></div>
                <div class="stat-value">₹<span th:text="${#numbers.formatDecimal(totalCollected, 0, 0)}">0</span></div>
                <div class="stat-label">Total Collected</div>
            </div>
            <div class="stat-card red">
                <div class="stat-icon"><i class='bx bxs-time-five'></i></div>
                <div class="stat-value">₹<span th:text="${#numbers.formatDecimal(totalPending, 0, 0)}">0</span></div>
                <div class="stat-label">Total Pending</div>
            </div>
        </div>

        <!-- Status Filter -->
        <div style="display:flex; gap:8px; margin-bottom:20px;">
            <a th:href="@{/billing}" class="btn btn-sm" th:classappend="${selectedStatus == null} ? 'btn-primary' : 'btn-outline'">All</a>
            <a th:href="@{/billing(status='Pending')}" class="btn btn-sm" th:classappend="${selectedStatus == 'Pending'} ? 'btn-primary' : 'btn-outline'">Pending</a>
            <a th:href="@{/billing(status='Partial')}" class="btn btn-sm" th:classappend="${selectedStatus == 'Partial'} ? 'btn-primary' : 'btn-outline'">Partial</a>
            <a th:href="@{/billing(status='Paid')}" class="btn btn-sm" th:classappend="${selectedStatus == 'Paid'} ? 'btn-primary' : 'btn-outline'">Paid</a>
        </div>

        <div class="card">
            <div class="card-body" style="padding:0;">
                <div class="table-container">
                    <table>
                        <thead><tr><th>#</th><th>Patient</th><th>Consultation</th><th>Medicine</th><th>Lab</th><th>Total (₹)</th><th>Paid (₹)</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody>
                            <tr th:each="bill, stat : ${bills}">
                                <td th:text="${stat.index + 1}">1</td>
                                <td th:text="${bill.patient.fullName}">Patient</td>
                                <td th:text="${bill.consultationFee}">0</td>
                                <td th:text="${bill.medicineCost}">0</td>
                                <td th:text="${bill.labTestCost}">0</td>
                                <td><strong th:text="${#numbers.formatDecimal(bill.totalAmount, 0, 2)}">0</strong></td>
                                <td th:text="${#numbers.formatDecimal(bill.paidAmount, 0, 2)}">0</td>
                                <td>
                                    <span class="badge" th:classappend="${bill.status == 'Paid'} ? 'badge-paid' : (${bill.status == 'Partial'} ? 'badge-partial' : 'badge-pending')" th:text="${bill.status}">Status</span>
                                </td>
                                <td>
                                    <div class="btn-group">
                                        <a th:href="@{/billing/view/{id}(id=${bill.id})}" class="btn btn-sm btn-outline"><i class='bx bx-show'></i></a>
                                        <a th:href="@{/billing/edit/{id}(id=${bill.id})}" class="btn btn-sm btn-primary"><i class='bx bx-edit'></i></a>
                                        <a th:href="@{/billing/delete/{id}(id=${bill.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Delete?')"><i class='bx bx-trash'></i></a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(bills)}">
                                <td colspan="9"><div class="empty-state"><div class="empty-icon">💰</div><h3>No bills found</h3></div></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
