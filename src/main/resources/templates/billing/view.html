<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{layout :: layout(~{::content})}">
    <div th:fragment="content">
        <div class="page-header">
            <h1><i class='bx bxs-receipt mr-1'></i> Invoice</h1>
            <div class="page-actions">
                <button onclick="window.print()" class="btn btn-primary"><i class='bx bx-printer'></i> Print</button>
                <a th:href="@{/billing}" class="btn btn-outline"><i class='bx bx-arrow-back'></i> Back</a>
            </div>
        </div>
        <div class="card invoice-card">
            <div class="invoice-header">
                <h2 style="font-size:28px; margin-bottom:4px;">🏥 MedCare HMS</h2>
                <p class="text-muted">Hospital Management System</p>
                <p class="text-muted" style="margin-top:12px;">Invoice #<span th:text="${bill.id}">000</span></p>
                <p class="text-muted">Date: <span th:text="${bill.createdAt}">2026-10-06</span></p>
            </div>
            <div class="card-body">
                <div class="detail-grid mb-3">
                    <div class="detail-item"><div class="detail-label">Patient</div><div class="detail-value" th:text="${bill.patient.fullName}">-</div></div>
                    <div class="detail-item"><div class="detail-label">Payment Method</div><div class="detail-value" th:text="${bill.paymentMethod}">-</div></div>
                    <div class="detail-item"><div class="detail-label">Status</div>
                        <span class="badge" th:classappend="${bill.status == 'Paid'} ? 'badge-paid' : (${bill.status == 'Partial'} ? 'badge-partial' : 'badge-pending')" th:text="${bill.status}">-</span>
                    </div>
                </div>
                <div class="table-container">
                    <table>
                        <thead><tr><th>Description</th><th class="text-right">Amount (₹)</th></tr></thead>
                        <tbody>
                            <tr><td>Consultation Fee</td><td class="text-right" th:text="${#numbers.formatDecimal(bill.consultationFee, 0, 2)}">0</td></tr>
                            <tr><td>Medicine Cost</td><td class="text-right" th:text="${#numbers.formatDecimal(bill.medicineCost, 0, 2)}">0</td></tr>
                            <tr><td>Lab Test Cost</td><td class="text-right" th:text="${#numbers.formatDecimal(bill.labTestCost, 0, 2)}">0</td></tr>
                            <tr><td>Room Charges</td><td class="text-right" th:text="${#numbers.formatDecimal(bill.roomCharges, 0, 2)}">0</td></tr>
                            <tr><td>Other Charges</td><td class="text-right" th:text="${#numbers.formatDecimal(bill.otherCharges, 0, 2)}">0</td></tr>
                            <tr><td class="text-red">Discount</td><td class="text-right text-red" th:text="'-' + ${#numbers.formatDecimal(bill.discount, 0, 2)}">0</td></tr>
                            <tr><td>Tax (5%)</td><td class="text-right" th:text="${#numbers.formatDecimal(bill.tax, 0, 2)}">0</td></tr>
                        </tbody>
                    </table>
                </div>
                <div style="display:flex; justify-content:space-between; padding:20px; margin-top:12px; background:rgba(99,102,241,0.1); border-radius:12px;">
                    <div><span class="text-muted">Total Amount</span><div style="font-size:24px; font-weight:800;">₹<span th:text="${#numbers.formatDecimal(bill.totalAmount, 0, 2)}">0</span></div></div>
                    <div class="text-right"><span class="text-muted">Paid</span><div style="font-size:24px; font-weight:800;" class="text-green">₹<span th:text="${#numbers.formatDecimal(bill.paidAmount, 0, 2)}">0</span></div></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
