<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | MedCare Hospital System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <script>
        (function() {
            var savedTheme = localStorage.getItem('hms-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>
    <!-- Theme Switcher Top-Right -->
    <div style="position:fixed; top:20px; right:24px; z-index:100;">
        <button type="button" class="theme-toggle-btn" id="themeToggle" onclick="toggleTheme()" title="Switch Light/Dark Theme">
            <div class="toggle-track">
                <i class='bx bxs-sun icon-sun'></i>
                <i class='bx bxs-moon icon-moon'></i>
                <span class="toggle-thumb"></span>
            </div>
        </button>
    </div>

    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">
                    <i class='bx bx-plus-medical'></i>
                </div>
                <h1>MedCare Portal</h1>
                <p>Hospital Management &amp; Clinical Information System</p>
            </div>

            <!-- Error Message -->
            <div th:if="${param.error}" class="alert alert-danger">
                <i class='bx bx-error-circle'></i>
                Invalid username or password. Please try again.
            </div>

            <!-- Logout Message -->
            <div th:if="${param.logout}" class="alert alert-success">
                <i class='bx bx-check-circle'></i>
                You have been logged out securely.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control"
                           placeholder="Enter your username (e.g. admin, dr.sharma)" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">
                    <i class='bx bx-log-in'></i>
                    Sign In
                </button>
            </form>

            <div class="mt-3" style="text-align:center; padding-top:18px; border-top:1px solid var(--border-color);">
                <p class="text-muted" style="font-size:12px; margin-bottom:8px; font-weight:600;">
                    Quick Demo Logins (Click to autofill):
                </p>
                <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center;">
                    <button type="button" class="btn btn-sm btn-outline" onclick="fillCredentials('admin','admin123')">
                        <i class='bx bx-shield-quarter'></i> Admin
                    </button>
                    <button type="button" class="btn btn-sm btn-outline" onclick="fillCredentials('dr.sharma','doctor123')">
                        <i class='bx bx-plus-medical'></i> Doctor
                    </button>
                    <button type="button" class="btn btn-sm btn-outline" onclick="fillCredentials('reception','reception123')">
                        <i class='bx bx-user'></i> Receptionist
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fillCredentials(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }
    </script>
    <script th:src="@{/js/theme.js}"></script>
</body>
</html>
